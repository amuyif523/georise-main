<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEORISE Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0f1a;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
      }
      .card {
        width: min(92vw, 520px);
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(15, 23, 42, 0.9);
        border-radius: 14px;
        padding: 20px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.1rem;
      }
      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.45;
      }
      .muted {
        margin-top: 10px;
        font-size: 0.85rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>GEORISE is offline</h1>
      <p>
        The network is currently unavailable. If this is a refresh on a known route, the app shell
        should load as soon as cache is restored.
      </p>
      <p class="muted">You can retry once connectivity returns.</p>
    </main>
  </body>
</html>
